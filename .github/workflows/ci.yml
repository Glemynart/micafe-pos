name: CI

# MT-U0 — Gate de calidad: condición de merge hacia main.
# Valida tipos y pruebas antes de integrar. No despliega ni construye artefactos.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Alineado con el Node de desarrollo (22.x): los golden de test:tickets
          # embeben tiempos formateados con Intl, cuyo separador (U+00A0) depende
          # de la versión de ICU del runtime. Node 20 trae un ICU distinto y los
          # golden (generados bajo Node 22) fallaban en CI por ese carácter.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java para Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias de aplicaciÃ³n
        run: npm ci

      - name: Instalar dependencias de Functions
        run: npm ci
        working-directory: functions

      - name: Chequeo de tipos de aplicaciÃ³n
        run: npx tsc --noEmit

      - name: Build de aplicaciÃ³n
        run: npm run build

      - name: Build de Functions
        run: npm run build:functions

      - name: Lint de aplicacion y tooling
        run: npm run lint

      - name: Pruebas unitarias de preflight E2E
        run: npm run test:e2e:preflight

      - name: Pruebas de tickets
        run: npm run test:tickets

      - name: Pruebas de reimpresión
        run: npm run test:reimpresion

      - name: Pruebas unitarias P1-02 de recetas y modificadores
        run: npm run test:p1-02:unit

      - name: Pruebas de tenant
        run: npm run test:tenant

      - name: Pruebas de configuracion B1
        run: npm run test:configuracion

      - name: Pruebas de onboarding
        run: npm run test:onboarding

      - name: Pruebas de membresias
        run: npm run test:membresias

      - name: Verificador read-only de P0-01
        run: npm run test:p0-01:verifier

      - name: Contrato del plan MVP comercial
        run: npm run test:p0-01:plan

      - name: Pruebas del backfill operativo
        run: npm run test:backfill

      - name: Pruebas de Functions
        run: npm run test:auth-foundation

      - name: Certificacion P0-06 de turnos y arqueo en Emulator
        run: npm run e2e:p0-06

      - name: Certificacion P1-02 de recetas y modificadores en Emulator
        run: npm run e2e:p1-02

      - name: Certificacion P1-04 de salón y cocina en Emulator
        run: npm run e2e:p1-04

      - name: Pruebas de Rules tenant-aware
        run: npm run test:rules

      - name: Pruebas de Storage tenant-aware P2-03
        run: npm run test:storage-rules

      - name: Pruebas unitarias de lectura pública tenant-aware B2
        run: npm run test:eventos-publicos

      - name: Pruebas unitarias de inventario legacy B3-A
        run: npm run test:b3-eventos

      - name: Publicar evidencia P2-03 Storage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-03-storage-${{ github.run_id }}
          path: artifacts/e2e/p2-03/
          if-no-files-found: warn
          retention-days: 14

      - name: Certificacion P0-10 de restauracion Firestore en Emulator
        run: npm run e2e:p0-10

      - name: Pruebas de integración Auth y Firestore
        run: npm run test:email:integration

      - name: Instalar Chromium para E2E P0-01
        run: npx playwright install --with-deps chromium

      - name: E2E Operator Portal con Auth, Firestore y Functions
        run: npm run e2e:operator-portal

      - name: Publicar evidencia E2E Operator Portal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-operator-portal-${{ github.run_id }}
          path: artifacts/e2e/operator-portal/
          if-no-files-found: warn
          retention-days: 14

      - name: E2E R1-A con web, PWA y Electron
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run e2e:r1a

      - name: Publicar evidencia E2E R1-A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-r1a-${{ github.run_id }}
          path: artifacts/e2e/r1a/
          if-no-files-found: warn
          retention-days: 14

      - name: Smoke E2E P0-01 con Auth, Firestore y Functions
        run: npm run e2e:p0-01

      - name: Publicar evidencia E2E P0-01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-p0-01-${{ github.run_id }}
          path: artifacts/e2e/p0-01/
          if-no-files-found: warn
          retention-days: 14

      - name: E2E B2 de eventos públicos tenant-aware en Emulator
        run: npm run e2e:b2-eventos

      - name: Publicar evidencia E2E B2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-b2-eventos-${{ github.run_id }}
          path: artifacts/e2e/b2-eventos/
          if-no-files-found: warn
          retention-days: 14

      - name: Dry-run B3-A de Eventos legacy en Emulator
        run: npm run e2e:b3-eventos

      - name: Publicar evidencia B3-A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-b3-eventos-${{ github.run_id }}
          path: artifacts/e2e/b3-eventos/
          if-no-files-found: warn
          retention-days: 14

      - name: Backfill idempotente B3-B de Eventos legacy en Emulator
        run: npm run e2e:b3-eventos-backfill

      - name: Publicar evidencia B3-B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-b3-eventos-backfill-${{ github.run_id }}
          path: artifacts/e2e/b3-eventos-backfill/
          if-no-files-found: warn
          retention-days: 14

      - name: Certificación integral E4.1 del núcleo SaaS/POS en Emulator
        run: npm run e2e:e4-01

      - name: Publicar evidencia E4.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-01-${{ github.run_id }}
          path: artifacts/e2e/e4-01/
          if-no-files-found: warn
          retention-days: 14

      - name: Auditoría automática E4.2 de release readiness
        run: npm run test:e4-02:contract

      - name: Generar evidencia E4.2 de release readiness
        run: npm run e4-02:readiness
        env:
          E4_02_CI_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Publicar evidencia E4.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-02-${{ github.run_id }}
          path: artifacts/release/e4-02/
          if-no-files-found: warn
          retention-days: 14
