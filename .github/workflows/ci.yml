name: CI

# Perfil PR/main: validación rápida, estable y sensible al alcance. El gate
# pesado de release vive en release-gate.yml y conserva E4.1 completo, R1-A y
# Operator Portal sin repetirlos en cada cambio.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar alcance del cambio
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/changed-scope.mjs

      - name: Validar contrato de CI y release
        run: npm run test:e4-02:contract

      - name: Validar formato del diff documental
        if: steps.scope.outputs.documentation_only == 'true'
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$env:GITHUB_BASE_SHA..$env:GITHUB_HEAD_SHA"
        shell: pwsh

      - name: Setup Node
        if: steps.scope.outputs.run_core == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java para Firebase Emulator Suite
        if: steps.scope.outputs.run_core == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias de aplicación
        if: steps.scope.outputs.run_core == 'true'
        run: npm ci

      - name: Instalar dependencias de Functions
        if: steps.scope.outputs.run_core == 'true'
        run: npm ci
        working-directory: functions

      - name: Chequeo de tipos de aplicación
        if: steps.scope.outputs.run_core == 'true'
        run: npx tsc --noEmit

      - name: Build de aplicación
        if: steps.scope.outputs.run_core == 'true'
        run: npm run build

      - name: Build de Functions
        if: steps.scope.outputs.run_core == 'true'
        run: npm run build:functions

      - name: Lint de aplicación y tooling
        if: steps.scope.outputs.run_core == 'true'
        run: npm run lint

      - name: Pruebas unitarias de preflight E2E
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:e2e:preflight

      - name: Pruebas de scope CI
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:ci:scope

      - name: Pruebas de tickets
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:tickets

      - name: Pruebas de reimpresión
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:reimpresion

      - name: Pruebas unitarias P1-02 de recetas y modificadores
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:p1-02:unit

      - name: Pruebas de tenant
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:tenant

      - name: Pruebas de configuración B1
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:configuracion

      - name: Pruebas de onboarding
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:onboarding

      - name: Pruebas de membresías
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:membresias

      - name: Verificador read-only de P0-01
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:p0-01:verifier

      - name: Contrato del plan MVP comercial
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:p0-01:plan

      - name: Pruebas del backfill operativo
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:backfill

      - name: Pruebas de Functions y Auth
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:auth-foundation

      - name: Pruebas de integración Auth y Firestore
        if: steps.scope.outputs.functions == 'true' || steps.scope.outputs.firestore_rules == 'true'
        run: npm run test:email:integration

      - name: Pruebas de Rules tenant-aware
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:rules

      - name: Pruebas de Storage tenant-aware P2-03
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:storage-rules

      - name: Pruebas unitarias de lectura pública tenant-aware B2
        if: steps.scope.outputs.run_core == 'true'
        run: npm run test:eventos-publicos

      - name: Pruebas unitarias de inventario legacy B3-A
        if: steps.scope.outputs.b3 == 'true'
        run: npm run test:b3-eventos

      - name: Pruebas unitarias B3-B
        if: steps.scope.outputs.b3 == 'true'
        run: npm run test:b3-eventos-backfill

      - name: Instalar Chromium para smoke P0-01
        if: steps.scope.outputs.p001 == 'true'
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E P0-01 con Auth, Firestore y Functions
        if: steps.scope.outputs.p001 == 'true'
        run: npm run e2e:p0-01

      - name: Publicar evidencia E2E P0-01
        if: always() && steps.scope.outputs.p001 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-p0-01-${{ github.run_id }}
          path: artifacts/e2e/p0-01/
          if-no-files-found: warn
          retention-days: 14

      - name: Certificación P0-06 de turnos y arqueo
        if: steps.scope.outputs.p006 == 'true'
        run: npm run e2e:p0-06

      - name: Certificación P1-02 de recetas y modificadores
        if: steps.scope.outputs.p102 == 'true'
        run: npm run e2e:p1-02

      - name: Certificación P1-04 de salón y cocina
        if: steps.scope.outputs.p104 == 'true'
        run: npm run e2e:p1-04

      - name: Certificación P0-10 de restauración Firestore
        if: steps.scope.outputs.p010 == 'true'
        run: npm run e2e:p0-10

      - name: E2E B2 de eventos públicos tenant-aware
        if: steps.scope.outputs.b2 == 'true'
        run: npm run e2e:b2-eventos

      - name: Publicar evidencia E2E B2
        if: always() && steps.scope.outputs.b2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-b2-eventos-${{ github.run_id }}
          path: artifacts/e2e/b2-eventos/
          if-no-files-found: warn
          retention-days: 14

      - name: Dry-run B3-A de Eventos legacy
        if: steps.scope.outputs.b3 == 'true'
        run: npm run e2e:b3-eventos

      - name: Publicar evidencia B3-A
        if: always() && steps.scope.outputs.b3 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-b3-eventos-${{ github.run_id }}
          path: artifacts/e2e/b3-eventos/
          if-no-files-found: warn
          retention-days: 14

      - name: Backfill idempotente B3-B de Eventos legacy
        if: steps.scope.outputs.b3 == 'true'
        run: npm run e2e:b3-eventos-backfill

      - name: Publicar evidencia B3-B
        if: always() && steps.scope.outputs.b3 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-b3-eventos-backfill-${{ github.run_id }}
          path: artifacts/e2e/b3-eventos-backfill/
          if-no-files-found: warn
          retention-days: 14

      - name: Registrar perfil ejecutado
        if: always()
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/changed-scope.mjs
