name: CI

# MT-U0 — Gate de calidad: condición de merge hacia main.
# Valida tipos y pruebas antes de integrar. No despliega ni construye artefactos.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Pruebas de tickets
        run: npm run test:tickets

      - name: Pruebas de reimpresión
        run: npm run test:reimpresion
