name: CI

# MT-U0 — Gate de calidad: condición de merge hacia main.
# Valida tipos y pruebas antes de integrar. No despliega ni construye artefactos.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Alineado con el Node de desarrollo (22.x): los golden de test:tickets
          # embeben tiempos formateados con Intl, cuyo separador (U+00A0) depende
          # de la versión de ICU del runtime. Node 20 trae un ICU distinto y los
          # golden (generados bajo Node 22) fallaban en CI por ese carácter.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java para Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependencias de aplicaciÃ³n
        run: npm ci

      - name: Instalar dependencias de Functions
        run: npm ci
        working-directory: functions

      - name: Chequeo de tipos de aplicaciÃ³n
        run: npx tsc --noEmit

      - name: Build de aplicaciÃ³n
        run: npm run build

      - name: Build de Functions
        run: npm run build:functions

      - name: Lint de aplicacion y tooling
        run: npm run lint

      - name: Pruebas unitarias de preflight E2E
        run: npm run test:e2e:preflight

      - name: Pruebas de tickets
        run: npm run test:tickets

      - name: Pruebas de reimpresión
        run: npm run test:reimpresion

      - name: Pruebas unitarias P1-02 de recetas y modificadores
        run: npm run test:p1-02:unit

      - name: Pruebas de tenant
        run: npm run test:tenant

      - name: Pruebas de configuracion B1
        run: npm run test:configuracion

      - name: Pruebas de onboarding
        run: npm run test:onboarding

      - name: Pruebas de membresias
        run: npm run test:membresias

      - name: Verificador read-only de P0-01
        run: npm run test:p0-01:verifier

      - name: Contrato del plan MVP comercial
        run: npm run test:p0-01:plan

      - name: Pruebas del backfill operativo
        run: npm run test:backfill

      - name: Pruebas de Functions
        run: npm run test:auth-foundation

      - name: Certificacion P0-06 de turnos y arqueo en Emulator
        run: npm run e2e:p0-06

      - name: Certificacion P1-02 de recetas y modificadores en Emulator
        run: npm run e2e:p1-02

      - name: Certificacion P1-04 de salón y cocina en Emulator
        run: npm run e2e:p1-04

      - name: Pruebas de Rules tenant-aware
        run: npm run test:rules

      - name: Certificacion P0-10 de restauracion Firestore en Emulator
        run: npm run e2e:p0-10

      - name: Pruebas de integración Auth y Firestore
        run: npm run test:email:integration

      - name: Instalar Chromium para E2E P0-01
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E P0-01 con Auth, Firestore y Functions
        run: npm run e2e:p0-01

      - name: Publicar evidencia E2E P0-01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-p0-01-${{ github.run_id }}
          path: artifacts/e2e/p0-01/
          if-no-files-found: warn
          retention-days: 14
